name: runner

# 空壳执行器：把私有仓库拉下来跑。
# 这个仓库是公开的 —— 公开仓库的 Actions 分钟数不限，而"盯到 epoch 结束"很占时间。
# 真正的代码、README、站点信息都留在私有仓库，外部看不到。

on:
  workflow_dispatch: {}
  schedule:
    - cron: "6,18,30,42,54 * * * *"   # 兜底；主力触发来自外部定时器

permissions:
  contents: read

concurrency:
  group: runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.TARGET_REPO }}
          token: ${{ secrets.TARGET_REPO_PAT }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run
        env:
          DH_COOKIE: ${{ secrets.DH_COOKIE }}
        run: node claimer.mjs --cron --quiet

      # 每日签到 + 宝藏领取。脚本内部按天算一个随机目标时间，没到点就直接退出，
      # 所以每 12 分钟叫醒一次也不会重复签到。放在 always() 后面是为了挖矿领取
      # 失败/超时的时候签到照样能跑；continue-on-error 保证它不会把整次运行标红。
      - name: Daily check-in
        if: always()
        continue-on-error: true
        env:
          DH_COOKIE: ${{ secrets.DH_COOKIE }}
          DAILY_WINDOW: "08:00-22:30"
        run: node daily.mjs
